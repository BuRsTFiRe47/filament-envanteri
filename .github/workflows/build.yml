name: APK derle / Build APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketleri / System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake

      - name: Buildozer kur / Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Her derlemede aynı imza kullanılsın ki APK eskisinin üstüne güncellenebilsin
      # Use the same signing key every build so the APK can update over the old one
      - name: Sabit imza / Fixed signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: APK derle / Build APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: filament-envanteri-apk
          path: bin/*.apk

      - name: GitHub Release (v* etiketi / v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
